<!DOCTYPE html>
<!--
  index.html — the ONE web page of the whole app.

  It only holds the "frame": the top bar, the menu, and an empty <main> area.
  The JavaScript files (loaded at the bottom) draw each screen inside <main>
  when you click a menu item. This is called a "single-page app".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens properly instead of looking zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Shelf</title>
  <meta name="description" content="A private reading list, notebook and literature-review helper that runs entirely in your browser.">
  <!-- A tiny book emoji as the browser-tab icon, so we don't need an image file -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Apply her saved light/dark choice before the page is drawn -->
  <script>
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (e) { /* storage blocked: just follow the computer's setting */ }
    // The welcome animation plays once per visit: if it already played in
    // this browser tab, hide it straight away (see js/intro.js)
    try {
      if (sessionStorage.getItem('introShown')) document.documentElement.classList.add('no-intro');
    } catch (e) { /* storage blocked: the animation will just play */ }
  </script>
</head>
<body>
  <!--
    Welcome animation: "Achieve your Goal". It covers the screen for about
    three seconds while the app loads underneath, then lifts away.
    Tap or press any key to skip it. The movement is done in styles.css,
    the timing in js/intro.js. aria-hidden: screen readers skip straight to the app.
  -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-inner">
      <p class="intro-title">
        <span class="intro-word">Achieve</span>
        <span class="intro-word">your</span>
        <span class="intro-word intro-goal">Goal</span>
      </p>
      <p class="intro-sub">📚 Research Shelf</p>
    </div>
    <p class="intro-skip">Tap anywhere to continue</p>
  </div>

  <!-- "Skip link": lets keyboard users jump straight past the menu -->
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/dashboard">
      <span class="brand-mark" aria-hidden="true">📚</span>
      <span>Research Shelf</span>
    </a>

    <!-- The main menu. Each link changes the part of the address after "#",
         and app.js notices that and draws the matching screen. -->
    <nav class="mainnav" aria-label="Main menu">
      <a href="#/dashboard" data-route="dashboard">Home</a>
      <a href="#/library" data-route="library">Library</a>
      <a href="#/notes" data-route="notes">Notes</a>
      <a href="#/themes" data-route="themes">Themes</a>
      <a href="#/questions" data-route="questions">Questions</a>
      <a href="#/matrix" data-route="matrix">Matrix</a>
      <a href="#/citations" data-route="citations">Citations</a>
      <a href="#/backup" data-route="backup">Backup</a>
    </nav>

    <!-- Light / dark mode switch -->
    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch light or dark mode" title="Switch light or dark mode">
      <span aria-hidden="true">◐</span>
    </button>
  </header>

  <!-- Each screen is drawn inside here by JavaScript -->
  <main id="main" tabindex="-1">
    <p class="container muted">Loading…</p>
  </main>

  <!-- Small pop-up messages like "Saved ✓" appear here -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- If JavaScript is switched off, explain why nothing works -->
  <noscript><p class="container">This app needs JavaScript switched on in your browser.</p></noscript>

  <!--
    The JavaScript files. ORDER MATTERS: each file can use things defined
    in the files above it. db.js and app.js come first because every
    screen needs them.
  -->
  <script src="js/intro.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/library.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/files.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/citations.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
